<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>DeskFlow · Gestión de soporte</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f6f7fb;font-synthesis:none;text-rendering:optimizeLegibility;--ink:#172033;--muted:#758096;--line:#e7eaf0;--brand:#5b5ce2;--brand-soft:#eeeeff;--green:#14866d;--red:#c44956;--amber:#a66a13;--shadow:0 12px 34px rgba(27,39,71,.07)}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:248px;background:#fff;border-right:1px solid var(--line);padding:26px 17px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:12px;padding:2px 10px 32px}.brand-mark{width:37px;height:37px;border-radius:12px;background:var(--brand);color:white;display:grid;place-items:center;font-weight:800;font-size:19px}.brand strong{font-size:16px;letter-spacing:-.3px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.nav-label{font-size:10px;font-weight:700;color:#9aa3b3;letter-spacing:1.3px;padding:0 12px 10px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#727d92;text-align:left;padding:11px 12px;border-radius:9px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:13px}.nav button:hover{background:#f7f7ff;color:var(--brand)}.nav button.active{background:var(--brand-soft);color:var(--brand)}.nav-icon{font-size:17px;width:19px;text-align:center}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px 0;color:var(--muted);font-size:11px;line-height:1.6}.main{margin-left:248px;padding:32px 42px 60px;max-width:1700px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:31px}.eyebrow{font-size:12px;color:var(--muted);margin:0 0 7px}.topbar h1{font-size:25px;letter-spacing:-.7px;margin:0}.top-actions{display:flex;gap:10px;align-items:center}.date-chip,.avatar{background:white;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:12px;color:#667187}.avatar{border-radius:50%;width:39px;height:39px;padding:0;display:grid;place-items:center;background:#e8e8ff;color:var(--brand);font-weight:700}.page-heading{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:23px}.page-heading h2{font-size:19px;letter-spacing:-.4px;margin:0}.page-heading p{color:var(--muted);font-size:12px;margin:7px 0 0}.btn{border:1px solid var(--line);background:white;color:#455067;padding:10px 14px;border-radius:8px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{border-color:#b9bbf5;color:var(--brand)}.btn-primary{background:var(--brand);border-color:var(--brand);color:white}.btn-primary:hover{background:#4b4cce;color:white}.btn-danger{color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:24px}.stat,.card{background:white;border:1px solid #eceef3;border-radius:12px;box-shadow:0 3px 14px rgba(36,48,77,.025)}.stat{padding:19px 20px;min-height:116px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:600}.stat-icon{width:32px;height:32px;border-radius:9px;background:#f0f0ff;display:grid;place-items:center;font-size:15px}.stat-value{font-size:27px;font-weight:750;letter-spacing:-1px;margin-top:11px}.stat-note{font-size:10px;color:#98a1b0;margin-top:3px}.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(270px,.8fr);gap:17px}.card{padding:20px}.card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.card-title h3{margin:0;font-size:14px}.card-title p{margin:5px 0 0;font-size:11px;color:var(--muted)}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:15px}.search{position:relative;flex:1;max-width:370px}.search input{padding-left:34px}.search span{position:absolute;left:12px;top:10px;color:#939cad}.field-control{width:100%;border:1px solid #e3e6ed;border-radius:8px;padding:10px 11px;background:white;color:var(--ink);font-size:12px;outline:none}.field-control:focus{border-color:#9999f0;box-shadow:0 0 0 3px #eeeefe}.search input{padding-left:34px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#929bad;font-size:10px;text-transform:uppercase;letter-spacing:.55px;font-weight:700;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #f0f1f5;font-size:12px;color:#4d586e}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafaff}.person{display:flex;align-items:center;gap:9px}.person-icon{width:31px;height:31px;border-radius:10px;background:#eeefff;color:#5b5ce2;display:grid;place-items:center;font-weight:700;font-size:11px;flex-shrink:0}.person strong{display:block;color:#273149;font-size:12px}.person small{display:block;color:#98a1b0;font-size:10px;margin-top:3px}.badge{display:inline-flex;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:700;background:#f0f1f5;color:#687387}.status-Abierto{background:#fff4e4;color:#a86a12}.status-'En proceso'{background:#eaf0ff;color:#4a64be}.status-Pendiente{background:#fff0eb;color:#bd6542}.status-Resuelto{background:#e7f7f0;color:#168267}.priority-Alta{color:#bb4550}.priority-Media{color:#af781c}.priority-Baja{color:#788398}.link-button{border:0;background:none;color:var(--brand);font-weight:700;font-size:11px;padding:4px}.empty{text-align:center;padding:35px 12px;color:#8993a5;font-size:12px}.empty b{display:block;font-size:14px;color:#47536a;margin-bottom:5px}.activity{display:grid;gap:17px}.activity-item{display:flex;gap:11px;position:relative}.activity-icon{width:29px;height:29px;display:grid;place-items:center;background:#f0f0ff;border-radius:9px;font-size:13px;flex-shrink:0}.activity-copy{font-size:11px;line-height:1.5;color:#526078}.activity-copy strong{color:#2c374d}.activity-copy small{display:block;color:#9ba4b3;margin-top:4px}.bar-list{display:grid;gap:14px}.bar-label{display:flex;justify-content:space-between;font-size:11px;color:#657086;margin-bottom:7px}.bar-track{height:6px;border-radius:8px;background:#f0f1f5;overflow:hidden}.bar-fill{height:100%;background:var(--brand);border-radius:8px}.client-detail{display:grid;grid-template-columns:minmax(230px,.75fr) minmax(0,1.5fr);gap:16px}.detail-card{padding:22px}.detail-avatar{width:55px;height:55px;background:#efefff;color:var(--brand);display:grid;place-items:center;border-radius:15px;font-size:19px;font-weight:800;margin-bottom:14px}.detail-card h3{margin:0;font-size:17px}.detail-card .company{color:var(--muted);font-size:12px;margin:5px 0 18px}.detail-line{padding:11px 0;border-top:1px solid #f0f1f5;font-size:11px;color:#68748a;overflow-wrap:anywhere}.detail-line b{display:block;font-size:10px;color:#a0a8b5;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}.timeline{display:grid;gap:14px}.timeline-item{border-left:2px solid #e8e8ff;padding:0 0 3px 14px;font-size:11px;color:#68748a;line-height:1.5}.timeline-item strong{display:block;color:#303b52;margin-bottom:3px}.modal-backdrop{position:fixed;inset:0;background:rgba(20,27,45,.4);z-index:10;display:grid;place-items:center;padding:18px}.modal{width:min(580px,100%);max-height:92vh;overflow:auto;background:white;border-radius:14px;box-shadow:0 24px 80px #11182730;padding:23px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{margin:0;font-size:17px}.close{border:0;background:#f4f5f8;border-radius:8px;width:30px;height:30px;color:#647087;font-size:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-field.full{grid-column:1/-1}.form-field label{display:block;font-size:11px;color:#616c81;font-weight:650;margin-bottom:6px}.form-field textarea{resize:vertical;min-height:84px}.form-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.form-error{color:#bd414a;font-size:11px;margin:8px 0 0}.mobile-menu{display:none}.hidden{display:none!important}.ticket-status-select{border:1px solid #e5e8ee;border-radius:7px;padding:6px 7px;font-size:10px;background:white;color:#48546a}.subtle{font-size:10px;color:#97a0b0}.client-link{border:0;padding:0;background:none;text-align:left;color:#39465c;font-weight:650}.client-link:hover{color:var(--brand)}
    @media(max-width:1050px){.main{padding:27px 25px 50px}.stats{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}.sidebar{width:218px}.main{margin-left:218px}}
    @media(max-width:700px){.sidebar{transform:translateX(-100%);transition:transform .2s;width:245px;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding:20px 15px 40px}.mobile-menu{display:inline-flex}.topbar{margin-bottom:24px}.topbar h1{font-size:21px}.date-chip{display:none}.page-heading{align-items:flex-start;gap:12px}.page-heading .btn{white-space:nowrap}.stats{gap:9px}.stat{padding:14px;min-height:104px}.stat-value{font-size:23px}.stat-top{font-size:10px}.card{padding:15px}.toolbar{flex-wrap:wrap}.search{max-width:none;flex-basis:100%}.client-detail{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}.top-actions{gap:7px}}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">D</div><div><strong>DeskFlow</strong><small>Soporte al cliente</small></div></div>
    <div class="nav-label">MENÚ PRINCIPAL</div>
    <nav class="nav" aria-label="Menú principal">
      <button data-page="home" class="active"><span class="nav-icon">▦</span>Inicio</button>
      <button data-page="clients"><span class="nav-icon">♙</span>Clientes</button>
      <button data-page="tickets"><span class="nav-icon">▤</span>Tickets</button>
      <button data-page="technicians"><span class="nav-icon">⚙</span>Técnicos</button>
    </nav>
    <div class="side-bottom">Gestión de soporte<br>Los datos se guardan en este navegador.</div>
  </aside>
  <main class="main">
    <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="menuToggle" aria-label="Abrir menú">☰</button><div><p class="eyebrow" id="today"></p><h1 id="pageTitle">Inicio</h1></div></div><div class="top-actions"><div class="date-chip">◷ &nbsp; Espacio de trabajo</div><div class="avatar" title="Soporte">S</div></div></header>
    <section id="app"></section>
  </main>
</div>
<div id="modalRoot"></div>
<script>
(()=>{
  const KEY='deskflow-support-v1';
  const statuses=['Abierto','En proceso','Pendiente','Resuelto'];
  let data=loadData(), page='home', query='', ticketFilter='Todos', selectedClient=null;
  function loadData(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.clients)&&Array.isArray(d.tickets)&&Array.isArray(d.technicians)&&Array.isArray(d.events))return d}catch(e){}return {clients:[],tickets:[],technicians:[],events:[]}}
  function save(){localStorage.setItem(KEY,JSON.stringify(data))}
  function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
  function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function initials(s='?'){return s.trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'?'}
  function date(v){return new Date(v).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'})}
  function time(v){return new Date(v).toLocaleString('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
  function addEvent(text,clientId,ticketId){data.events.unshift({id:id(),text,clientId:clientId||null,ticketId:ticketId||null,at:new Date().toISOString()});save()}
  function clientName(cid){return data.clients.find(c=>c.id===cid)?.name||'Cliente eliminado'}
  function technicianName(tid){return data.technicians.find(t=>t.id===tid)?.name||'Sin asignar'}
  function setPage(p){page=p;query='';selectedClient=null;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();document.getElementById('sidebar').classList.remove('open')}
  document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
  document.getElementById('menuToggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
  document.getElementById('today').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  function render(){const titles={home:'Inicio',clients:'Clientes',tickets:'Tickets',technicians:'Técnicos'};document.getElementById('pageTitle').textContent=selectedClient?'Ficha del cliente':titles[page];const root=document.getElementById('app');root.innerHTML=page==='home'?homeView():page==='clients'?(selectedClient?clientDetailView(selectedClient):clientsView()):page==='tickets'?ticketsView():techniciansView();bindPage()}
  function heading(title,desc,button,label){return `<div class="page-heading"><div><h2>${title}</h2><p>${desc}</p></div>${button?`<button class="btn btn-primary" id="${button}">＋ ${label}</button>`:''}</div>`}
  function homeView(){const open=data.tickets.filter(t=>t.status!=='Resuelto').length,resolved=data.tickets.filter(t=>t.status==='Resuelto').length;const active=data.tickets.filter(t=>t.status!=='Resuelto').slice().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).slice(0,6);const counts=statuses.map(s=>[s,data.tickets.filter(t=>t.status===s).length]);const max=Math.max(1,...counts.map(x=>x[1]));return `${heading('Resumen de actividad','Vista general del soporte y las solicitudes de tus clientes','newTicket','Nuevo ticket')}<div class="stats"><div class="stat"><div class="stat-top">Total de clientes <span class="stat-icon">♙</span></div><div class="stat-value">${data.clients.length}</div><div class="stat-note">Clientes registrados</div></div><div class="stat"><div class="stat-top">Tickets abiertos <span class="stat-icon">◷</span></div><div class="stat-value">${open}</div><div class="stat-note">Pendientes de resolución</div></div><div class="stat"><div class="stat-top">Tickets resueltos <span class="stat-icon">✓</span></div><div class="stat-value">${resolved}</div><div class="stat-note">Incidencias completadas</div></div><div class="stat"><div class="stat-top">Técnicos <span class="stat-icon">⚙</span></div><div class="stat-value">${data.technicians.length}</div><div class="stat-note">En el equipo de soporte</div></div></div><div class="dashboard-grid"><div class="card"><div class="card-title"><div><h3>Tickets recientes</h3><p>Solicitudes que requieren seguimiento</p></div><button class="link-button" data-goto="tickets">Ver todos →</button></div>${active.length?`<div class="table-wrap"><table><thead><tr><th>Ticket</th><th>Cliente</th><th>Estado</th><th>Responsable</th></tr></thead><tbody>${active.map(t=>`<tr><td><strong>${esc(t.title)}</strong><div class="subtle">${date(t.createdAt)}</div></td><td>${esc(clientName(t.clientId))}</td><td><span class="badge ${statusClass(t.status)}">${esc(t.status)}</span></td><td>${esc(technicianName(t.technicianId))}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>Aún no hay tickets abiertos</b>Crea un ticket para comenzar a gestionar solicitudes.</div>`}</div><div class="card"><div class="card-title"><div><h3>Tickets por estado</h3><p>Distribución actual</p></div></div><div class="bar-list">${counts.map(([s,n])=>`<div><div class="bar-label"><span>${s}</span><b>${n}</b></div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/max*100)}%"></div></div></div>`).join('')}</div><div style="border-top:1px solid var(--line);margin:19px 0 15px"></div><div class="card-title"><div><h3>Actividad reciente</h3></div></div>${data.events.length?`<div class="activity">${data.events.slice(0,5).map(e=>`<div class="activity-item"><div class="activity-icon">${e.ticketId?'▤':'•'}</div><div class="activity-copy">${esc(e.text)}<small>${time(e.at)}</small></div></div>`).join('')}</div>`:`<div class="subtle">La actividad aparecerá aquí.</div>`}</div></div>`}
  function statusClass(s){return 'status-'+s.replace(/\s/g,'-')}
  function clientsView(){const q=query.toLowerCase();const rows=data.clients.filter(c=>[c.name,c.company,c.email,c.phone].join(' ').toLowerCase().includes(q));return `${heading('Clientes','Administra la información y el historial de tus clientes','newClient','Añadir cliente')}<div class="card"><div class="toolbar"><div class="search"><span>⌕</span><input id="searchInput" class="field-control" placeholder="Buscar por nombre, empresa o correo..." value="${esc(query)}"></div><span class="subtle">${rows.length} cliente${rows.length===1?'':'s'}</span></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Teléfono</th><th>Correo electrónico</th><th>Tickets</th><th>Acciones</th></tr></thead><tbody>${rows.map(c=>`<tr><td><div class="person"><div class="person-icon">${initials(c.name)}</div><div><button class="client-link" data-detail="${c.id}">${esc(c.name)}</button><small>${esc(c.company||'Particular')}</small></div></div></td><td>${esc(c.phone||'—')}</td><td>${esc(c.email||'—')}</td><td><span class="badge">${data.tickets.filter(t=>t.clientId===c.id).length} tickets</span></td><td><button class="link-button" data-edit-client="${c.id}">Editar</button><button class="link-button" data-delete-client="${c.id}" style="color:var(--red)">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>${query?'No se encontraron clientes':'Todavía no hay clientes'}</b>${query?'Prueba con otros términos de búsqueda.':'Registra un cliente para empezar.'}</div>`}</div>`}
  function ticketsView(){const q=query.toLowerCase();let rows=data.tickets.filter(t=>[t.title,t.description,clientName(t.clientId),technicianName(t.technicianId)].join(' ').toLowerCase().includes(q)&&(ticketFilter==='Todos'||t.status===ticketFilter));rows.sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));return `${heading('Tickets','Crea, asigna y da seguimiento a incidencias','newTicket','Nuevo ticket')}<div class="card"><div class="toolbar"><div class="search"><span>⌕</span><input id="searchInput" class="field-control" placeholder="Buscar tickets..." value="${esc(query)}"></div><select id="statusFilter" class="field-control" style="width:auto;min-width:145px"><option>Todos</option>${statuses.map(s=>`<option ${ticketFilter===s?'selected':''}>${s}</option>`).join('')}</select><span class="subtle">${rows.length} ticket${rows.length===1?'':'s'}</span></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Incidencia</th><th>Cliente</th><th>Prioridad</th><th>Estado</th><th>Técnico asignado</th><th>Fecha</th><th></th></tr></thead><tbody>${rows.map(t=>`<tr><td><strong>${esc(t.title)}</strong><div class="subtle">${esc(t.description.slice(0,55))}${t.description.length>55?'…':''}</div></td><td><button class="client-link" data-detail="${t.clientId}">${esc(clientName(t.clientId))}</button></td><td><span class="priority-${esc(t.priority)}">${esc(t.priority)}</span></td><td><select class="ticket-status-select" data-status-ticket="${t.id}">${statuses.map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></td><td><select class="ticket-status-select" data-tech-ticket="${t.id}"><option value="">Sin asignar</option>${data.technicians.map(x=>`<option value="${x.id}" ${x.id===t.technicianId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></td><td>${date(t.createdAt)}</td><td><button class="link-button" data-edit-ticket="${t.id}">Editar</button><button class="link-button" data-delete-ticket="${t.id}" style="color:var(--red)">×</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>${query||ticketFilter!=='Todos'?'No hay tickets que coincidan':'Todavía no hay tickets'}</b>${query||ticketFilter!=='Todos'?'Cambia la búsqueda o el filtro.':'Crea una incidencia y asígnala a un cliente.'}</div>`}</div>`}
  function techniciansView(){const q=query.toLowerCase();const rows=data.technicians.filter(t=>[t.name,t.email,t.specialty].join(' ').toLowerCase().includes(q));return `${heading('Técnicos','Gestiona el equipo responsable de atender incidencias','newTechnician','Añadir técnico')}<div class="card"><div class="toolbar"><div class="search"><span>⌕</span><input id="searchInput" class="field-control" placeholder="Buscar técnicos..." value="${esc(query)}"></div><span class="subtle">${rows.length} técnico${rows.length===1?'':'s'}</span></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Técnico</th><th>Correo electrónico</th><th>Especialidad</th><th>Tickets activos</th><th>Acciones</th></tr></thead><tbody>${rows.map(t=>`<tr><td><div class="person"><div class="person-icon">${initials(t.name)}</div><div><strong>${esc(t.name)}</strong></div></div></td><td>${esc(t.email||'—')}</td><td>${esc(t.specialty||'General')}</td><td><span class="badge">${data.tickets.filter(x=>x.technicianId===t.id&&x.status!=='Resuelto').length}</span></td><td><button class="link-button" data-edit-tech="${t.id}">Editar</button><button class="link-button" data-delete-tech="${t.id}" style="color:var(--red)">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>${query?'No se encontraron técnicos':'Añade técnicos a tu equipo'}</b>${query?'Prueba con otra búsqueda.':'Podrás asignarles tickets una vez registrados.'}</div>`}</div>`}
  function clientDetailView(cid){const c=data.clients.find(x=>x.id===cid);if(!c){selectedClient=null;return clientsView()}const tickets=data.tickets.filter(t=>t.clientId===cid).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));const events=data.events.filter(e=>e.clientId===cid);return `<div class="page-heading"><div><button class="link-button" id="backClients">← Volver a clientes</button><h2 style="margin-top:8px">Ficha del cliente</h2><p>Datos, incidencias e historial de atención.</p></div><div style="display:flex;gap:8px"><button class="btn" data-edit-client="${c.id}">Editar cliente</button><button class="btn btn-primary" id="newTicket" data-client="${c.id}">＋ Crear ticket</button></div></div><div class="client-detail"><div class="card detail-card"><div class="detail-avatar">${initials(c.name)}</div><h3>${esc(c.name)}</h3><div class="company">${esc(c.company||'Particular')}</div><div class="detail-line"><b>Correo electrónico</b>${esc(c.email||'No indicado')}</div><div class="detail-line"><b>Teléfono</b>${esc(c.phone||'No indicado')}</div><div class="detail-line"><b>Dirección</b>${esc(c.address||'No indicada')}</div><div class="detail-line"><b>Cliente desde</b>${date(c.createdAt)}</div></div><div style="display:grid;gap:16px"><div class="card"><div class="card-title"><div><h3>Tickets del cliente</h3><p>${tickets.length} incidencia${tickets.length===1?'':'s'} registrada${tickets.length===1?'':'s'}</p></div></div>${tickets.length?`<div class="table-wrap"><table><thead><tr><th>Incidencia</th><th>Estado</th><th>Técnico</th><th>Actualizado</th></tr></thead><tbody>${tickets.map(t=>`<tr><td><strong>${esc(t.title)}</strong><div class="subtle">${esc(t.description)}</div></td><td><span class="badge ${statusClass(t.status)}">${esc(t.status)}</span></td><td>${esc(technicianName(t.technicianId))}</td><td>${date(t.updatedAt)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Este cliente todavía no tiene tickets.</div>`}</div><div class="card"><div class="card-title"><div><h3>Historial de actividad</h3><p>Registro de cambios y atención del cliente</p></div></div>${events.length?`<div class="timeline">${events.map(e=>`<div class="timeline-item"><strong>${esc(e.text)}</strong>${time(e.at)}</div>`).join('')}</div>`:`<div class="empty">El historial aparecerá cuando se registren actividades.</div>`}</div></div></div>`}
  function openModal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle">${title}</h3><button class="close" id="closeModal" aria-label="Cerrar">×</button></div>${body}</section></div>`;document.getElementById('closeModal').onclick=closeModal;document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.addEventListener('keydown',escModal,{once:true});const first=document.querySelector('#modalRoot input');if(first)first.focus()}
  function escModal(e){if(e.key==='Escape')closeModal()}
  function closeModal(){document.getElementById('modalRoot').innerHTML=''}
  function formField(label,name,value='',type='text',required=false,full=false,placeholder=''){return `<div class="form-field ${full?'full':''}"><label for="f-${name}">${label}${required?' *':''}</label><input class="field-control" id="f-${name}" name="${name}" type="${type}" value="${esc(value||'')}" ${required?'required':''} placeholder="${esc(placeholder)}"></div>`}
  function clientForm(c){openModal(c?'Editar cliente':'Registrar cliente',`<form id="entityForm"><div class="form-grid">${formField('Nombre completo','name',c?.name,'text',true)}${formField('Empresa','company',c?.company)}${formField('Teléfono','phone',c?.phone,'tel')}${formField('Correo electrónico','email',c?.email,'email')}${formField('Dirección','address',c?.address,'text',false,true)}</div><p class="form-error" id="formError"></p><div class="form-footer"><button type="button" class="btn" id="cancelForm">Cancelar</button><button class="btn btn-primary">${c?'Guardar cambios':'Registrar cliente'}</button></div></form>`);document.getElementById('cancelForm').onclick=closeModal;document.getElementById('entityForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim(),email=f.get('email').trim();if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){document.getElementById('formError').textContent='Introduce un correo electrónico válido.';return}const fields={name,company:f.get('company').trim(),phone:f.get('phone').trim(),email,address:f.get('address').trim()};if(c){Object.assign(c,fields);addEvent(`Se actualizaron los datos de ${name}`,c.id)}else{const nc={id:id(),...fields,createdAt:new Date().toISOString()};data.clients.push(nc);addEvent(`Se registró el cliente ${name}`,nc.id)}save();closeModal();render()}}
  function technicianForm(t){openModal(t?'Editar técnico':'Añadir técnico',`<form id="entityForm"><div class="form-grid">${formField('Nombre completo','name',t?.name,'text',true)}${formField('Correo electrónico','email',t?.email,'email')}${formField('Especialidad','specialty',t?.specialty,'text',false,true)}</div><p class="form-error" id="formError"></p><div class="form-footer"><button type="button" class="btn" id="cancelForm">Cancelar</button><button class="btn btn-primary">${t?'Guardar cambios':'Añadir técnico'}</button></div></form>`);document.getElementById('cancelForm').onclick=closeModal;document.getElementById('entityForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),fields={name:f.get('name').trim(),email:f.get('email').trim(),specialty:f.get('specialty').trim()};if(fields.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(fields.email)){document.getElementById('formError').textContent='Introduce un correo electrónico válido.';return}if(t)Object.assign(t,fields);else data.technicians.push({id:id(),...fields});addEvent(t?`Se actualizaron los datos del técnico ${fields.name}`:`Se añadió al técnico ${fields.name}`);save();closeModal();render()}}
  function ticketForm(t,defaultClient){if(!data.clients.length){alert('Primero registra un cliente para poder crear un ticket.');setPage('clients');return}openModal(t?'Editar ticket':'Crear ticket',`<form id="entityForm"><div class="form-grid"><div class="form-field full"><label for="f-title">Asunto *</label><input class="field-control" id="f-title" name="title" required value="${esc(t?.title||'')}" placeholder="Ej. No funciona la conexión VPN"></div><div class="form-field full"><label for="f-description">Descripción *</label><textarea class="field-control" id="f-description" name="description" required placeholder="Describe el problema y los pasos para reproducirlo">${esc(t?.description||'')}</textarea></div><div class="form-field"><label for="f-clientId">Cliente *</label><select class="field-control" id="f-clientId" name="clientId" required><option value="">Seleccionar cliente</option>${data.clients.map(c=>`<option value="${c.id}" ${(t?.clientId||defaultClient)===c.id?'selected':''}>${esc(c.name)}${c.company?` · ${esc(c.company)}`:''}</option>`).join('')}</select></div><div class="form-field"><label for="f-technicianId">Técnico asignado</label><select class="field-control" id="f-technicianId" name="technicianId"><option value="">Sin asignar</option>${data.technicians.map(x=>`<option value="${x.id}" ${t?.technicianId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="form-field"><label for="f-priority">Prioridad</label><select class="field-control" id="f-priority" name="priority">${['Baja','Media','Alta'].map(p=>`<option ${(t?.priority||'Media')===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="form-field"><label for="f-status">Estado</label><select class="field-control" id="f-status" name="status">${statuses.map(s=>`<option ${(t?.status||'Abierto')===s?'selected':''}>${s}</option>`).join('')}</select></div></div><p class="form-error" id="formError"></p><div class="form-footer"><button type="button" class="btn" id="cancelForm">Cancelar</button><button class="btn btn-primary">${t?'Guardar cambios':'Crear ticket'}</button></div></form>`);document.getElementById('cancelForm').onclick=closeModal;document.getElementById('entityForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),now=new Date().toISOString(),fields={title:f.get('title').trim(),description:f.get('description').trim(),clientId:f.get('clientId'),technicianId:f.get('technicianId')||'',priority:f.get('priority'),status:f.get('status')};if(t){const old=t.status;Object.assign(t,fields,{updatedAt:now});addEvent(old!==t.status?`El ticket «${t.title}» cambió de ${old} a ${t.status}`:`Se actualizaron los datos del ticket «${t.title}»`,t.clientId,t.id)}else{const nt={id:id(),...fields,createdAt:now,updatedAt:now};data.tickets.push(nt);addEvent(`Se creó el ticket «${nt.title}»`,nt.clientId,nt.id)}save();closeModal();render()}}
  function bindPage(){const newClient=document.getElementById('newClient');if(newClient)newClient.onclick=()=>clientForm();const newTech=document.getElementById('newTechnician');if(newTech)newTech.onclick=()=>technicianForm();const newTicket=document.getElementById('newTicket');if(newTicket)newTicket.onclick=()=>ticketForm(null,newTicket.dataset.client||'');const back=document.getElementById('backClients');if(back)back.onclick=()=>{selectedClient=null;render()};document.querySelectorAll('[data-goto]').forEach(x=>x.onclick=()=>setPage(x.dataset.goto));const search=document.getElementById('searchInput');if(search)search.oninput=()=>{query=search.value;const pos=search.selectionStart;render();const next=document.getElementById('searchInput');next.focus();next.setSelectionRange(pos,pos)};const filter=document.getElementById('statusFilter');if(filter)filter.onchange=()=>{ticketFilter=filter.value;render()};document.querySelectorAll('[data-detail]').forEach(x=>x.onclick=()=>{selectedClient=x.dataset.detail;render()});document.querySelectorAll('[data-edit-client]').forEach(x=>x.onclick=()=>clientForm(data.clients.find(c=>c.id===x.dataset.editClient)));document.querySelectorAll('[data-delete-client]').forEach(x=>x.onclick=()=>deleteClient(x.dataset.deleteClient));document.querySelectorAll('[data-edit-tech]').forEach(x=>x.onclick=()=>technicianForm(data.technicians.find(t=>t.id===x.dataset.editTech)));document.querySelectorAll('[data-delete-tech]').forEach(x=>x.onclick=()=>deleteTech(x.dataset.deleteTech));document.querySelectorAll('[data-edit-ticket]').forEach(x=>x.onclick=()=>ticketForm(data.tickets.find(t=>t.id===x.dataset.editTicket)));document.querySelectorAll('[data-delete-ticket]').forEach(x=>x.onclick=()=>deleteTicket(x.dataset.deleteTicket));document.querySelectorAll('[data-status-ticket]').forEach(x=>x.onchange=()=>{const t=data.tickets.find(t=>t.id===x.dataset.statusTicket);if(t){const old=t.status;t.status=x.value;t.updatedAt=new Date().toISOString();addEvent(`El ticket «${t.title}» cambió de ${old} a ${t.status}`,t.clientId,t.id);save();render()}});document.querySelectorAll('[data-tech-ticket]').forEach(x=>x.onchange=()=>{const t=data.tickets.find(t=>t.id===x.dataset.techTicket);if(t){t.technicianId=x.value;t.updatedAt=new Date().toISOString();addEvent(`Se actualizó el técnico asignado al ticket «${t.title}»: ${technicianName(t.technicianId)}`,t.clientId,t.id);save();render()}})}
  function deleteClient(cid){const c=data.clients.find(x=>x.id===cid);if(!c)return;const n=data.tickets.filter(t=>t.clientId===cid).length;const warning=n?` Tiene ${n} ticket(s) asociado(s), que también se eliminarán.`:'';if(!confirm(`¿Eliminar a ${c.name}?${warning} Esta acción no se puede deshacer.`))return;data.clients=data.clients.filter(x=>x.id!==cid);data.tickets=data.tickets.filter(t=>t.clientId!==cid);data.events=data.events.filter(e=>e.clientId!==cid);selectedClient=null;save();render()}
  function deleteTech(tid){const t=data.technicians.find(x=>x.id===tid);if(!t||!confirm(`¿Eliminar al técnico ${t.name}? Sus tickets quedarán sin asignar.`))return;data.technicians=data.technicians.filter(x=>x.id!==tid);data.tickets.forEach(x=>{if(x.technicianId===tid)x.technicianId=''});addEvent(`Se eliminó al técnico ${t.name}`);save();render()}
  function deleteTicket(tid){const t=data.tickets.find(x=>x.id===tid);if(!t||!confirm(`¿Eliminar el ticket «${t.title}»? Esta acción no se puede deshacer.`))return;data.tickets=data.tickets.filter(x=>x.id!==tid);data.events=data.events.filter(e=>e.ticketId!==tid);addEvent(`Se eliminó el ticket «${t.title}»`,t.clientId);save();render()}
  render();
})();
</script>
</body>
</html>
